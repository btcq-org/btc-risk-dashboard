[tool.ruff]
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Ruff's default rule set (pyflakes + the pycodestyle errors that don't overlap
# with the formatter). Kept explicit so a user-level ruff config can't change it.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["indexer"]
markers = [
    "integration: needs a live bitcoind and/or blk*.dat files; run with `pytest -m integration`",
]
# Unit tests only by default; `-m integration` on the command line overrides this.
addopts = "-m 'not integration'"
